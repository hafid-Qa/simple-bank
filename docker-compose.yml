version: '3.8'

services:
  # PostgreSQL Database

  postgres:
    image: postgres:15.2-alpine
    container_name: go_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_api_db
    ports:
      - "5432:5432"
    networks:
      - go_api_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 50

  postgres_test:
    image: postgres:15.2-alpine
    container_name: postgres_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_api_db
    networks:
      - go_api_network
    ports:
      - "5433:5432"





volumes:
  postgres_data:
  go_mod_cache:

networks:
  go_api_network:
    driver: bridge
